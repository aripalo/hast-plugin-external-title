# pnpm settings for this single-package repository. pnpm 11 reads `overrides`
# and `allowBuilds` from here rather than from package.json.

# Install scripts, reviewed explicitly. pnpm blocks any script it has not been
# told about, so every entry here is a deliberate decision.
allowBuilds:
  # Allowed: esbuild's postinstall verifies and links the platform binary that
  # Vite and Astro shell out to. The matching @esbuild/<platform> package is
  # installed as an optional dependency, so it is close to a no-op — but
  # esbuild is load-bearing for the Astro integration build, so let it check.
  esbuild: true
  # Skipped: msw's postinstall copies a Service Worker into a public/ directory
  # for *browser* mocking. This repo only uses `msw/node`, which patches
  # globalThis.fetch and needs no worker file on disk.
  msw: false

# These force patched versions of transitive dev dependencies flagged by
# `pnpm audit`. All of them arrive through vitest -> vite -> postcss -> nanoid,
# so none reaches the published package — `dependencies` is only @types/hast,
# cheerio, isomorphic-dompurify and lowdb. They are pinned anyway because CI
# executes this toolchain.
#
# `pnpm audit --fix=override` generates one entry per advisory, which stacks up
# to three overlapping ranges for postcss alone. Collapsed here to the single
# highest patched floor per package. Drop an entry once the dependency tree
# resolves at or above it on its own.
overrides:
  # GHSA-28wg-ghj8-5hjv (>=3.3.16), GHSA-2v37-7h3g-55p8 (>=3.3.18)
  nanoid: ^3.3.18
  # GHSA-6g55-p6wh-862q (>=8.5.12), GHSA-r28c-9q8g-f849 (>=8.5.18),
  # GHSA-fxqj-rqcc-2cmp (>=8.5.23)
  postcss: ^8.5.23
  # GHSA-fx2h-pf6j-xcff and GHSA-v6wh-96g9-6wx3 (>=8.0.16)
  vite: ^8.0.16
