name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Only the newest run per ref matters; cancel superseded ones.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.22.2 is pinned exactly because it is the floor declared in
        # package.json `engines`. A bare `22` would resolve to the newest 22.x
        # and never actually exercise the claim. The other two track the latest
        # 22.x and 24.x — and the latest 24.x satisfies the `^24.15.0` arm of
        # the supported range.
        #
        # The floor is set by isomorphic-dompurify 3, which requires
        # ^22.22.2 || ^24.15.0 || >=26.0.0. pnpm 11 (>=22.13) and
        # @vitest/coverage-v8 (^22.14) are both comfortably below it.
        #
        # Coverage still runs only in `verify`, to avoid instrumenting the same
        # suite three times.
        #
        # pnpm 11 needs Node >=22.13 to run from npm, but that does not
        # constrain this matrix: pnpm/setup installs pnpm's native
        # per-platform executable, which does not run on Node at all, and then
        # installs the runtime under test separately.
        node: ['22.22.2', '22', '24']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs pnpm and Node in one step, replacing actions/setup-node. The
      # pnpm version is read from the `packageManager` field, so CI cannot
      # drift from local.
      - name: Set up pnpm and Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          runtime: node@${{ matrix.node }}
          cache: true
          # Install explicitly below, so --frozen-lockfile is guaranteed rather
          # than inferred from CI detection.
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

  verify:
    name: Typecheck, coverage and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test with coverage
        # Thresholds are set to 100% in vitest.config.ts, so this fails the
        # build if coverage regresses.
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      - name: Verify the package contents
        # Catches an `exports`/`files` mistake before it reaches a release.
        run: pnpm pack --pack-destination "${RUNNER_TEMP}"
