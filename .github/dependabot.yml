version: 2

updates:
  # Workflow actions are pinned to commit SHAs, which cannot be read at a
  # glance and never update themselves. Dependabot understands the
  # `uses: owner/repo@<sha> # vX.Y.Z` convention and bumps both the SHA and the
  # trailing version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'ci'
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      # `build:` does not trigger a release, which is what we want for a
      # dev-dependency bump.
      prefix: 'build'
      prefix-development: 'build'
    groups:
      dev-dependencies:
        dependency-type: development
        patterns: ['*']
    ignore:
      # Held on 9.x deliberately: 10.x requires
      # conventional-changelog-writer@9, which
      # @semantic-release/release-notes-generator@14 does not yet ship. See the
      # comment in release.config.mjs.
      - dependency-name: conventional-changelog-conventionalcommits
        update-types: ['version-update:semver-major']
      # Bumping this would silently change the published package's supported
      # Node range; do it deliberately.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
